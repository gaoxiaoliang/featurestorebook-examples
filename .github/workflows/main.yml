name: Hourly Titanic Feature Pipeline & Inference

# 每小时触发
on:
  schedule:
    - cron: '0 6 * * 1'   
  workflow_dispatch:       # 可手动触发

jobs:
  run-titanic-scripts:
    runs-on: ubuntu-latest

    env:
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}

    steps:
      # 1️⃣ 检出代码
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # 确保可以切换分支提交

      # 2️⃣ 设置 Python
      - name: Set up Python 3.11.9
        uses: actions/setup-python@v4
        with:
          python-version: 3.11.9

      # 3️⃣ 安装依赖
      - name: Install dependencies
        working-directory: chapter02
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4️⃣ 执行脚本
      - name: Run feature pipeline (retry up to 10 times)
        working-directory: chapter02
        run: |
          set -e

          for i in $(seq 1 10); do
            echo "🚀 Feature pipeline attempt $i / 10"
            if python scheduled-titanic-feature-pipeline-daily.py; then
              echo "✅ Feature pipeline succeeded on attempt $i"
              break
            fi

            if [ "$i" -eq 10 ]; then
              echo "❌ Feature pipeline failed after 10 attempts"
              exit 1
            fi

            echo "⏳ Sleeping 60 seconds before retry..."
            sleep 60
          done
      - name: Run batch inference (retry up to 10 times)
        working-directory: chapter02
        run: |
          set -e

          for i in $(seq 1 10); do
            echo "🚀 Batch inference attempt $i / 10"
            if python scheduled-titanic-batch-inference-daily.py; then
              echo "✅ Batch inference succeeded on attempt $i"
              break
            fi

            if [ "$i" -eq 10 ]; then
              echo "❌ Batch inference failed after 10 attempts"
              exit 1
            fi

            echo "⏳ Sleeping 60 seconds before retry..."
            sleep 60
          done

      # 5️⃣ 提交 HTML 到 gh-pages 分支
      - name: Commit and push titanic.html to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/deploy
          cp chapter02/titanic.html /tmp/deploy/

          git checkout -f gh-pages
          cp /tmp/deploy/titanic.html chapter02/
          git add chapter02/titanic.html

          # 仅当文件有改动时才 commit
          git diff --cached --quiet || git commit -m "Update titanic.html ($(date -u))"

          # 推送到 gh-pages 分支
          git push origin gh-pages
